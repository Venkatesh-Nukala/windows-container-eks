    <rect x="110" y="370" width="72" height="90" rx="8" fill="#fff" stroke="#5D91C1" stroke-width="4"/>
    <path d="M158 370 V394 H182" fill="none" stroke="#5D91C1" stroke-width="4"/>
    <path d="M122 432 C139 413 162 420 171 438 C158 459 132 462 122 432Z" fill="#1685D5"/>
