    <text x="270" y="475" text-anchor="middle" class="note">Base image and build instructions</text>

    <rect x="505" y="335" width="390" height="170" rx="20" fill="#F2EEFF" stroke="#B69BE8" stroke-width="3"/>
    <rect x="540" y="370" width="82" height="82" rx="14" fill="#267BC4"/>
