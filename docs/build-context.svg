<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Windows developer image build context</title>
  <desc id="desc">The C windows-devtools folder contains a Dockerfile and two PowerShell installation scripts.</desc>
  <defs>
