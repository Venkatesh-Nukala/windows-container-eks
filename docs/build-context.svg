    <style>
      .title{font:700 34px 'Segoe UI',Arial,sans-serif;fill:#173B5B}
      .path{font:700 30px 'Segoe UI',Arial,sans-serif;fill:#fff}
      .file{font:600 27px 'Segoe UI',Arial,sans-serif;fill:#19354F}
      .note{font:17px 'Segoe UI',Arial,sans-serif;fill:#5B7085}
    </style>
  </defs>
  <rect width="1200" height="690" fill="#F7FAFE"/>
  <rect x="18" y="18" width="1164" height="654" rx="26" fill="#fff" stroke="#B7CDE2" stroke-width="3"/>
  <text x="600" y="75" text-anchor="middle" class="title">Windows image build context</text>
